# ResortsLite - Cloud-Native Configuration for Azure
# All sensitive values externalized to Azure Key Vault and App Configuration

spring.application.name=ResortsLite

# FIXED cr-java-0077: Dynamic port assignment for container orchestration
# Port is now configurable via environment variable (default: 8080)
server.port=${PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Credentials externalized to Azure Key Vault
spring.datasource.url=${AZURE_DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${AZURE_DB_USERNAME:sa}
spring.datasource.password=${AZURE_DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Azure Blob Storage Configuration
# FIXED cr-java-0061, cr-java-0062, cr-java-0063: Azure Blob Storage for file operations
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}

# Azure Key Vault Configuration
# FIXED cr-java-0069: Azure Key Vault for secrets management
azure.keyvault.uri=${AZURE_KEYVAULT_URI}

# Azure Service Bus Configuration
# FIXED cr-java-0111: Azure Service Bus for distributed scheduling
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-reports}

# Azure Cache for Redis Configuration
# FIXED cr-java-0065, cr-java-0067: Azure Cache for Redis for session and cache management
spring.redis.host=${AZURE_REDIS_HOST}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=${AZURE_REDIS_TIMEOUT:2000}

# Redis connection pool settings
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Azure Active Directory Configuration
# FIXED cr-java-0090: Azure AD for authentication
azure.ad.client-id=${AZURE_AD_CLIENT_ID}
azure.ad.tenant-id=${AZURE_AD_TENANT_ID}
azure.ad.client-secret=${AZURE_AD_CLIENT_SECRET}

# Application Endpoints Configuration
# FIXED cr-java-0071: Externalized URLs to Azure App Configuration
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-service.azurewebsites.net/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-service.azurewebsites.net/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notification-service.azurewebsites.net/send}
app.report.base-url=${APP_REPORT_BASE_URL:https://reports.azurewebsites.net}

# Azure App Configuration
# FIXED cr-java-0071: Azure App Configuration for centralized configuration management
spring.cloud.azure.appconfiguration.enabled=${AZURE_APP_CONFIG_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APP_CONFIG_ENDPOINT:}

# Logging Configuration
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.level.com.azure=INFO

# Security Configuration
# Disable default Spring Security for backward compatibility (configure as needed)
spring.security.enabled=${SPRING_SECURITY_ENABLED:false}

# Actuator Configuration for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
