# ResortsLite - Cloud-Native Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Dynamic port assignment for container orchestration
# Port is now configurable via environment variable (ECS/EKS will inject this)
server.port=${SERVER_PORT:8080}

# FIXED cr-java-0069: Database configuration externalized
# Credentials are retrieved from AWS Secrets Manager at runtime
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065: Redis configuration for distributed session management
# Amazon ElastiCache for Redis endpoint
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=resort:session
spring.session.timeout=30m

# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
# These values are injected via environment variables from Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 configuration for file storage
# Amazon S3 bucket for report storage
aws.s3.bucket.reports=${S3_REPORTS_BUCKET:resort-reports-bucket}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069: AWS Secrets Manager configuration
aws.secretsmanager.secret.name=${DB_SECRET_NAME:resort-db-credentials}

# FIXED cr-java-0071: Reports base URL externalized
app.reports.base.url=${REPORTS_BASE_URL:https://reports.resorts-internal.com/download}

# Logging configuration for cloud environments
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
