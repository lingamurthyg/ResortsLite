# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port is now configurable via environment variable
# Container orchestration (ECS/EKS) can override this dynamically
server.port=${SERVER_PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Credentials are now loaded from AWS Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# FIXED cr-java-0071: Service endpoints are now externalized to environment variables
# These can be configured via AWS Systems Manager Parameter Store or environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# AWS Configuration
# FIXED cr-java-0069: AWS Secrets Manager configuration for database credentials
aws.secrets.database.name=${AWS_SECRET_DB_NAME:resorts-db-credentials}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 bucket for file storage
aws.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resorts-reports-bucket}

# FIXED cr-java-0071: Parameter Store configuration for URLs
aws.ssm.reports.url.parameter=${AWS_SSM_REPORTS_URL:/resorts/reports/base-url}

# AWS Region
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0065, cr-java-0067: Redis configuration for session and cache management
# Amazon ElastiCache for Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# FIXED cr-java-0065: Spring Session with Redis
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=30m

# Logging Configuration
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.level.software.amazon.awssdk=WARN
