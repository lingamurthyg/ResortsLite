# ResortsLite - Cloud-Ready Configuration
# All values support environment variable overrides for cloud deployment

spring.application.name=ResortsLite

# FIXED cr-java-0077: Dynamic port assignment for cloud environments
# Supports environment variable override for ECS/EKS dynamic port binding
server.port=${SERVER_PORT:8080}

# FIXED cr-java-0069: Database configuration with Secrets Manager support
# In production, these are retrieved from AWS Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# H2 Console (disable in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis configuration for distributed session and cache
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=${SESSION_TIMEOUT:30m}

# FIXED cr-java-0071: Externalized service endpoints using Parameter Store pattern
# These values are injected from AWS Systems Manager Parameter Store in production
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 configuration for file storage
aws.s3.reports.bucket=${REPORTS_BUCKET:resort-reports-bucket}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069, cr-java-0090: AWS Secrets Manager configuration
aws.secrets.database.name=${DB_SECRET_NAME:resorts/database/credentials}
aws.secrets.auth.name=${AUTH_SECRET_NAME:resorts/auth/credentials}

# FIXED cr-java-0071: Reports base URL externalized
app.reports.base.url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# Cache TTL configuration
app.cache.booking.ttl.minutes=${BOOKING_CACHE_TTL:30}

# Logging configuration (cloud-ready structured logging)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.demo.resortslite=${APP_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# AWS SDK configuration
aws.sdk.disableCertChecking=${AWS_SDK_DISABLE_CERT_CHECK:false}
