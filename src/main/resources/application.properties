# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# FIXED cr-java-0077: Use environment variable for dynamic port assignment
server.port=${SERVER_PORT:8080}

# FIXED cr-java-0069: Database credentials externalized to environment variables
# In production, these should be retrieved from AWS Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0071: Service endpoints externalized to AWS Parameter Store / environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 configuration for file storage
aws.s3.bucket.name=${S3_BUCKET_NAME:resorts-reports-bucket}
aws.s3.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069: AWS Secrets Manager configuration
aws.secrets.db.secret.name=${DB_SECRET_NAME:resorts/db/credentials}

# FIXED cr-java-0065, cr-java-0067: Redis configuration for distributed session and cache
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session

# Cache TTL configuration (in seconds)
app.cache.ttl=${CACHE_TTL:3600}
