# ResortsLite - PostgreSQL Configuration
spring.application.name=ResortsLite

# Server port — use environment variable for dynamic assignment in ECS/EKS
server.port=${SERVER_PORT:8080}

# PostgreSQL DataSource Configuration
# Connection string migrated from H2/MySQL to PostgreSQL 16 format.
# Credentials and host are externalised to environment variables for cloud deployment.
# Use AWS Parameter Store or Secrets Manager to inject these at runtime.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Connection Pool Settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Schema initialisation — use PostgreSQL-compatible schema scripts
spring.sql.init.platform=postgresql

# Internal service endpoints — externalised to environment variables for cloud deployment
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
