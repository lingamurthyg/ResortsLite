# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalized via environment variables
# and AWS Systems Manager Parameter Store / Secrets Manager.
spring.application.name=ResortsLite

# Server port: injected at runtime by ECS/EKS/Elastic Beanstalk via environment variable.
# Defaults to 8080 for local development.
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Database configuration — credentials sourced from AWS Secrets Manager.
# The application retrieves the secret at startup via AwsSecretsManagerConfig.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Amazon S3 — object storage replacing local file system operations.
# Bucket name is injected via environment variable or Parameter Store.
# -----------------------------------------------------------------------
aws.s3.bucket-name=${S3_BUCKET_NAME:resorts-lite-reports}
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# AWS Secrets Manager — secret name holding DB credentials JSON.
# -----------------------------------------------------------------------
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# AWS Systems Manager Parameter Store — externalized service URLs.
# Values are resolved at runtime; environment variable overrides are
# supported for local development.
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# -----------------------------------------------------------------------
# Spring Session — Amazon ElastiCache for Redis (distributed sessions).
# Replaces in-process HttpSession to support horizontal scaling on AWS.
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# -----------------------------------------------------------------------
# Spring Cache — Redis-backed cache with TTL for distributed caching.
# Replaces in-memory HashMap cache (bookingCache) in BookingController.
# -----------------------------------------------------------------------
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
