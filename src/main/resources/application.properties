# ResortsLite - Cloud-Ready Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now configurable via environment variable
# Container orchestration (ECS/EKS) can override this dynamically
server.port=${SERVER_PORT:8080}

# FIXED cr-java-0069: Database credentials externalized to AWS Secrets Manager
# Connection details loaded from environment variables or Parameter Store
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis configuration for Amazon ElastiCache
# Distributed session management and caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session configuration for Redis-backed sessions
spring.session.store-type=redis
spring.session.redis.namespace=resort:session
spring.session.timeout=24h

# Redis cache configuration with TTL
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
# These values should be injected from Parameter Store or environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}
app.reports.base.url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 bucket configuration
# Amazon S3 replaces local file system storage
aws.s3.reports.bucket=${S3_REPORTS_BUCKET:resort-reports-bucket}
aws.s3.backups.bucket=${S3_BACKUPS_BUCKET:resort-backups-bucket}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069, cr-java-0090: AWS Secrets Manager configuration
# Credentials and authentication data stored in Secrets Manager
aws.secrets.database.name=${DB_SECRET_NAME:resort-db-credentials}
aws.secrets.payment.name=${PAYMENT_SECRET_NAME:resort-payment-api-credentials}

# Cloud-native logging configuration
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints for health checks (required for ECS/EKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
