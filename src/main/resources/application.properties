# ResortsLite - Cloud-Ready Configuration for Azure
spring.application.name=ResortsLite

# Dynamic port assignment for Azure Container Apps / AKS
server.port=${PORT:8080}

# Database configuration - externalized to environment variables
spring.datasource.url=${AZURE_DATABASE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${AZURE_DATABASE_USERNAME:sa}
spring.datasource.password=${AZURE_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Azure Blob Storage configuration
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
azure.storage.blob-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:resortslite-reports}

# Azure Key Vault configuration
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.tenant-id=${AZURE_TENANT_ID:}
azure.keyvault.client-id=${AZURE_CLIENT_ID:}
azure.keyvault.client-secret=${AZURE_CLIENT_SECRET:}

# Azure Redis Cache for session management
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session

# Azure Service Bus for scheduled tasks
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}

# Azure Active Directory configuration
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_AD_CLIENT_SECRET:}
azure.activedirectory.user-group.allowed-groups=${AZURE_AD_ALLOWED_GROUPS:}

# External service endpoints - externalized to environment variables
app.payment.endpoint=${PAYMENT_SERVICE_ENDPOINT:https://payment-svc.azurewebsites.net/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_ENDPOINT:https://inventory-svc.azurewebsites.net/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_ENDPOINT:https://notify.azurewebsites.net/send}

# Cache TTL configuration (in seconds)
app.cache.ttl=${CACHE_TTL:3600}
app.cache.max-size=${CACHE_MAX_SIZE:1000}
