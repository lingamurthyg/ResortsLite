# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected at runtime via environment variables
# (ECS task definitions, EKS pod specs, or Elastic Beanstalk environment properties).
spring.application.name=ResortsLite

# Server port is driven by the SERVER_PORT environment variable injected by the
# container orchestration platform (ECS/EKS/Elastic Beanstalk).
# Replaces the hard-coded port=8080 (cr-java-0077).
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Datasource — credentials are loaded from AWS Secrets Manager at runtime
# by BookingService. Spring Boot datasource is configured via environment
# variables injected by ECS/EKS for cloud deployments; H2 is used locally.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Spring Session — backed by Amazon ElastiCache for Redis.
# Replaces HttpSession-based state storage (cr-java-0065).
# Enables stateless application instances with centralised, distributed
# session management across all ECS/EKS instances.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# Redis / ElastiCache connection — host and port injected via environment variables.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# ---------------------------------------------------------------------------
# AWS region — used by AWS SDK v2 clients (S3, Secrets Manager, SSM).
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Application-level service endpoints — externalised to environment variables.
# Values are also retrievable from AWS SSM Parameter Store at runtime
# (cr-java-0071). These properties serve as local-development fallbacks.
# ---------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# ---------------------------------------------------------------------------
# AWS Secrets Manager — secret name for database credentials (cr-java-0069).
# Set DB_SECRET_NAME in the ECS task definition / EKS pod spec.
# ---------------------------------------------------------------------------
app.db.secret-name=${DB_SECRET_NAME:}

# ---------------------------------------------------------------------------
# Amazon S3 — bucket name for report storage (cr-java-0061, cr-java-0062, cr-java-0063).
# Set REPORT_S3_BUCKET in the ECS task definition / EKS pod spec.
# ---------------------------------------------------------------------------
app.report.s3-bucket=${REPORT_S3_BUCKET:resorts-reports-default}
