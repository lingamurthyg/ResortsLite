# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Dynamic port assignment for cloud environments (ECS/EKS)
# Fixed: cr-java-0077 - Replace hard-coded ports with environment variable injection
server.port=${SERVER_PORT:8080}

# Database configuration - externalized to environment variables
# Fixed: cr-java-0069 - Replace hard-coded database credentials with AWS Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP connection pooling configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Redis configuration for distributed session management
# Fixed: cr-java-0065 - Replace HTTP session storage with Amazon ElastiCache for Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
spring.session.timeout=${SESSION_TIMEOUT:1800}

# Redis cache configuration with TTL
# Fixed: cr-java-0067 - Replace in-memory caching with Amazon ElastiCache for Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL:3600000}
spring.cache.redis.cache-null-values=false

# AWS S3 configuration for file storage
# Fixed: cr-java-0061, cr-java-0062, cr-java-0063 - Replace file system operations with S3
aws.s3.bucket.name=${S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}

# AWS Secrets Manager configuration
# Fixed: cr-java-0069 - Externalize credentials to AWS Secrets Manager
aws.secrets.enabled=${AWS_SECRETS_ENABLED:false}
aws.secrets.db-credentials=${AWS_SECRET_DB_CREDENTIALS:resorts/db/credentials}

# AWS Systems Manager Parameter Store configuration
# Fixed: cr-java-0071 - Externalize environment URLs to Parameter Store
aws.ssm.enabled=${AWS_SSM_ENABLED:false}

# External service endpoints - externalized to environment variables
# Fixed: cr-java-0071 - Replace hard-coded environment URLs with Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# Timezone configuration - standardize on UTC
# Fixed: cr-java-0111 - Replace timezone dependencies with UTC standardization
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
