# ResortsLite - Cloud-Ready Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now configurable via environment variable for dynamic assignment
# Container orchestration (ECS/EKS) can override this via SERVER_PORT environment variable
server.port=${SERVER_PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Database credentials externalized to AWS Secrets Manager
# Connection details retrieved at runtime from Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis configuration for distributed session and cache management
# Amazon ElastiCache for Redis connection details
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session configuration for Redis
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=24h

# Redis cache configuration with TTL
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# FIXED cr-java-0071: All environment-specific URLs externalized to Parameter Store
# These values should be retrieved from AWS Systems Manager Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}
app.reports.download.url=${REPORTS_DOWNLOAD_URL:https://reports.resorts-internal.com/download}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: AWS S3 configuration for file storage
aws.s3.reports.bucket=${S3_REPORTS_BUCKET:resort-reports-bucket}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069, cr-java-0090: AWS Secrets Manager configuration
aws.secretsmanager.database.secret.name=${DB_SECRET_NAME:resorts-db-credentials}

# Logging configuration for cloud environments
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Cloud-native health and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
