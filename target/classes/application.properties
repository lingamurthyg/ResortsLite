# ResortsLite - PostgreSQL Configuration for Spring Boot 3.x and Java 21
spring.application.name=ResortsLite

# Server Configuration
# FIXED: Use environment variable for port to allow dynamic assignment by ECS/EKS
server.port=${PORT:8080}

# PostgreSQL Database Configuration
# FIXED: Externalized to environment variables for cloud deployment
# Use AWS Parameter Store or Secrets Manager in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Optimized for PostgreSQL with proper timeout settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.pool-name=ResortsLiteHikariCP

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# PostgreSQL specific settings
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Enable batch processing for better performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection validation
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.datasource.hikari.auto-commit=true

# FIXED: Externalized service endpoints to environment variables
# Use service discovery (AWS Cloud Map, Consul) in production
app.payment.endpoint=${PAYMENT_SERVICE_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:http://notify.internal:7070/send}

# Logging Configuration
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Report and Backup Configuration
# FIXED: Externalized file paths for cloud/container compatibility
app.report.base.path=${REPORT_BASE_PATH:/tmp/reports/}
app.backup.path=${BACKUP_PATH:/tmp/backups/}
app.report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
